name: Release validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to validate
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        description: Full commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # Only the latest release-PR head waits for approval.
  group: release-validation-${{ github.event.pull_request.number || inputs.sha || github.sha }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Release validation
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release automation
        run: pnpm test:release
      - name: Install configured Rust toolchains
        run: |
          rustup show
          cd crates/ditherette-wasm
          rustup toolchain install nightly-2024-08-02 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned browser engines
        run: pnpm --filter ditherette exec playwright install --with-deps chromium firefox webkit
      - name: Fetch locked dependencies for offline oracle preparation
        run: |
          cargo fetch --locked --manifest-path tools/spec-freeze/syntax/Cargo.toml
          cargo fetch --locked --manifest-path crates/ditherette-bench-oracle/Cargo.toml
          cargo fetch --locked --manifest-path crates/ditherette-bench/Cargo.toml
      - name: Build fresh ordinary package and frozen oracle
        run: |
          mkdir -p target
          node scripts/prepare-public-benchmark.mjs "$GITHUB_WORKSPACE/target/conformance-public" | tee target/conformance-build.log
          cargo run --locked --release --manifest-path crates/ditherette-bench/Cargo.toml --example yliluoma_conformance -- "$GITHUB_WORKSPACE/target/yliluoma-conformance.json"
          node --input-type=module <<'JS' >> "$GITHUB_ENV"
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const root = process.env.GITHUB_WORKSPACE;
          const bundle = `${root}/target/conformance-public`;
          const tarball = `${bundle}/ditherette.tgz`;
          console.log(`DITHERETTE_TEST_TARBALL=${tarball}`);
          console.log(`DITHERETTE_TEST_TARBALL_SHA256=${createHash('sha256').update(await readFile(tarball)).digest('hex')}`);
          console.log(`DITHERETTE_BENCH_ORACLE=${bundle}/scripts/oracle`);
          console.log(`DITHERETTE_BENCH_YLILUOMA_FIXTURES=${root}/target/yliluoma-conformance.json`);
          console.log(`DITHERETTE_BENCH_AUTO_BUNDLE=${bundle}/bundle-source.json`);
          JS
      - name: Native scalar and threaded conformance
        run: |
          cargo test --locked --release --manifest-path crates/ditherette-wasm/Cargo.toml
          cargo test --locked --release --manifest-path crates/ditherette-wasm/Cargo.toml --features threads
      - name: Public types, interface, and private ownership
        run: |
          pnpm --filter ditherette test:interface
          pnpm --filter ditherette test:staging
          pnpm --filter ditherette-wasm test:glue:built
          node --test --test-concurrency=1 crates/ditherette-wasm/tests/private_processor.mjs crates/ditherette-wasm/tests/private_quantize.mjs crates/ditherette-wasm/tests/private_fields.mjs crates/ditherette-wasm/tests/private_diffusion.mjs crates/ditherette-wasm/tests/private_yiluoma.mjs crates/ditherette-wasm/tests/private_process.mjs
      - name: Scalar Chromium, Firefox, and WebKit matrix
        run: pnpm --filter ditherette-wasm test:conformance | tee target/conformance-scalar.log
      - name: Threaded Chromium and Firefox lifecycle
        env:
          DITHERETTE_TEST_ENGINES: chromium,firefox
        run: pnpm --filter ditherette-wasm test:conformance:threads | tee target/conformance-threads.log
      - name: Actual automatic policies in Chromium and Firefox
        run: pnpm --filter ditherette-wasm test:conformance:automatic | tee target/conformance-automatic.log
      - name: Website types and tests
        run: |
          pnpm check
          pnpm exec vitest run
      - name: Build website and test production output
        run: |
          pnpm build:web
          pnpm exec playwright test
      - name: Report coverage limits
        if: always()
        run: |
          echo '::warning::Pinned WebKit 26.4 threaded atomic-wait cleanup remains blocked. This job requires scalar WebKit, but does not certify threaded WebKit or performance release gates.'
          echo 'See docs/plans/ditherette-v1/s40-conformance.md for exact coverage and retained release blockers.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          path: |
            target/conformance-*.log
            target/conformance-public/ditherette.tgz
            target/conformance-public/build-provenance.json
          retention-days: 14
