name: Publish ditherette

on:
  workflow_call:
    inputs:
      sha:
        description: Full commit SHA to publish
        required: true
        type: string
      override_v1_release_holds:
        description: Apply the approved original-v1 size and qualification exception
        required: false
        type: boolean
        default: false
      release_authorization_sha:
        description: Original merged release authorizing a source-identical retry
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ditherette-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mia-cx/ditherette'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned publication tools
        run: npm install --global npm@11.17.0
      - name: Install the wasm toolchain
        run: |
          rustup show
          rustup toolchain install nightly-2024-08-02 --profile minimal --component rust-src --target wasm32-unknown-unknown
          cargo fetch --locked --manifest-path tools/spec-freeze/syntax/Cargo.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/ditherette-wasm
            tools/spec-freeze/syntax
      - run: pnpm install --frozen-lockfile
      - name: Verify the merged release authorizes publication
        env:
          GH_TOKEN: ${{ github.token }}
          DITHERETTE_RELEASE_SHA: ${{ inputs.release_authorization_sha || inputs.sha }}
          DITHERETTE_RELEASE_RETRY: 'true'
        run: |
          plan="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DITHERETTE_RELEASE_SHA/pulls" --paginate --slurp | node scripts/release-plan.mjs)"
          printf '%s\n' "$plan"
          test "$(printf '%s\n' "$plan" | grep '^release=')" = release=true
          test "$(printf '%s\n' "$plan" | grep '^npm=')" = npm=true
          echo 'DITHERETTE_RELEASE_MERGE=true' >> "$GITHUB_ENV"
      - name: Prepare the exact release tarball
        run: |
          # rust-cache injects this override; preparation requires the committed build configuration.
          unset CARGO_INCREMENTAL
          mkdir -p target
          node packages/ditherette/scripts/release.mjs prepare "$GITHUB_WORKSPACE/target/release" | tee target/release-build.log
      - name: Verify source, artifact, sizes, and recorded release holds
        env:
          DITHERETTE_RELEASE_SHA: ${{ inputs.sha }}
          OVERRIDE_V1_RELEASE_HOLDS: ${{ inputs.override_v1_release_holds }}
          RELEASE_AUTHORIZATION_SHA: ${{ inputs.release_authorization_sha || inputs.sha }}
        run: |
          # Each Actions step receives the job environment again, including the cache override.
          unset CARGO_INCREMENTAL
          node scripts/release-plan.mjs current npm
          if [ "$RELEASE_AUTHORIZATION_SHA" != "$DITHERETTE_RELEASE_SHA" ]; then
            # Retry artifacts must retain the authorized release's production source.
            # Only publication automation, its tests, and direction may differ.
            git diff --quiet "$RELEASE_AUTHORIZATION_SHA" "$DITHERETTE_RELEASE_SHA" -- . \
              ':!.github/workflows/release.yml' ':!.github/workflows/package-publish.yml' \
              ':!scripts/release-plan.mjs' ':!scripts/release-workflow.test.mjs' ':!DIRECTION.md'
          fi
          if [ "${OVERRIDE_V1_RELEASE_HOLDS:-false}" = true ]; then
            # Mia explicitly approved these two publication exceptions on 2026-10-26.
            # Keep source/artifact verification and every other publication check.
            test "$RELEASE_AUTHORIZATION_SHA" = 259b6258d5060523699d5e0b1d7bf24eb1c4e9d7
            test "$DITHERETTE_RELEASE_SHA" = "$GITHUB_SHA"
            test "$(jq -r .version packages/ditherette/package.json)" = 1.0.0
            node packages/ditherette/scripts/release.mjs verify "$GITHUB_WORKSPACE/target/release"
            node --input-type=module <<'JS'
          import { requirePublication } from './packages/ditherette/scripts/release-contract.mjs';
          requirePublication({ holds: [] }, [], process.env, '1.0.0', process.env.DITHERETTE_RELEASE_SHA);
          console.log('Applying Mia-approved v1.0.0 size-budget and WebKit qualification exceptions.');
          JS
          else
            node packages/ditherette/scripts/release.mjs publish-check "$GITHUB_WORKSPACE/target/release"
          fi
      - name: Check for an identical published version
        id: registry
        run: node scripts/release-registry.mjs target/release/ditherette.tgz
      - name: Publish the tested tarball through trusted publishing
        if: steps.registry.outputs.exists != 'true'
        env:
          PUBLISH_SHA: ${{ inputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PUBLISH_SHA"
          test "$GITHUB_SHA" = "$PUBLISH_SHA"
          npm publish target/release/ditherette.tgz --access public --tag latest --provenance --ignore-scripts
      - name: Tag and release the published version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTHORIZATION_SHA: ${{ inputs.release_authorization_sha || inputs.sha }}
        run: |
          version="$(jq -r .version packages/ditherette/package.json)"
          tag="ditherette@$version"
          sha="${{ inputs.sha }}"
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          if target="$(git rev-list -n 1 "refs/tags/$tag" 2>/dev/null)" && [ -n "$target" ]; then
            if [ "$target" != "$sha" ] && [ "$target" != "$RELEASE_AUTHORIZATION_SHA" ]; then
              echo "::error::Tag $tag exists at $target, not $sha." >&2
              exit 1
            fi
            # An earlier attempt may have tagged the original authorized release.
            # Keep that immutable tag when recovering its missing GitHub release.
            sha="$target"
          else
            git tag "$tag" "$sha"
            git push origin "refs/tags/$tag"
          fi
          # A previous attempt may have pushed the tag before release creation failed.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; skipping."
            exit 0
          fi
          node scripts/changelog-section.mjs packages/ditherette/CHANGELOG.md "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$sha" --title "ditherette $version" --notes-file "$RUNNER_TEMP/notes.md" --latest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ditherette-release-${{ inputs.sha }}
          path: |
            target/release/ditherette.tgz
            target/release/release-report.json
            target/release-*.log
          retention-days: 30
