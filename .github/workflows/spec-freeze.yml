name: Frozen reference

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  frozen-reference:
    name: Frozen reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install reference compiler
        run: rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
      - name: Read maintainer policy approvals
        id: approvals
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # A comment approves only when its whole body is one approval line and its author
        # can administer or maintain this repository. Each approves one exact policy digest.
        run: |
          digests=""
          if test -n "$PR"; then
            while read -r login digest; do
              role=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .role_name)
              case "$role" in admin | maintain) digests="$digests $digest" ;; esac
            done < <(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '
              .[] | select(.body | test("^/approve-freeze sha256:[0-9a-f]{64}\\s*$"))
              | "\(.user.login) \(.body | capture("sha256:(?<digest>[0-9a-f]{64})").digest)"')
          fi
          echo "digests=$digests" >> "$GITHUB_OUTPUT"
      - name: Validate with exact base policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          APPROVED: ${{ steps.approvals.outputs.digests }}
        run: |
          if test -f trusted/tools/spec-freeze/guard.mjs; then
            approvals=()
            for digest in $APPROVED; do approvals+=(--approved "$digest"); done
            node trusted/tools/spec-freeze/guard.mjs --root "$GITHUB_WORKSPACE/candidate" --trusted-root "$GITHUB_WORKSPACE/trusted" "${approvals[@]}"
          elif test "$BASE_SHA" = e0101af71410e7551d8de7ed4d54056e3d7f0fd8; then
            echo 'S18 bootstrap: candidate policy requires explicit human review.'
            node candidate/tools/spec-freeze/guard.mjs
          else
            echo 'Missing trusted freeze policy; refusing to select a new checkpoint.' >&2
            exit 1
          fi
      - name: Exercise controlled mutations
        run: node --test candidate/tools/spec-freeze/guard.test.mjs
