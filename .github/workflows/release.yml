name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_release_commit:
        description: Retry publication and deployment for this 40-character release merge commit
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ditherette-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      npm: ${{ steps.plan.outputs.npm }}
      web: ${{ steps.plan.outputs.web }}
      pending: ${{ steps.plan.outputs.pending }}
      sha: ${{ steps.target.outputs.sha }}
      validated: ${{ steps.validate.outputs.validated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - name: Resolve the release commit
        id: target
        env:
          RETRY_SHA: ${{ inputs.retry_release_commit }}
        run: |
          if [ -z "$RETRY_SHA" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit
          fi
          if ! [[ "$RETRY_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'retry_release_commit must be a full commit SHA' >&2
            exit 1
          fi
          git cat-file -e "$RETRY_SHA^{commit}"
          git merge-base --is-ancestor "$RETRY_SHA" origin/main
          echo "sha=$RETRY_SHA" >> "$GITHUB_OUTPUT"
      - name: Identify merged release and changed versions
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.target.outputs.sha }}
          # A retry replays the release merge; the plan still requires it to be one.
          GITHUB_EVENT_NAME: ${{ inputs.retry_release_commit != '' && 'push' || github.event_name }}
          GITHUB_REF: ${{ inputs.retry_release_commit != '' && 'refs/heads/main' || github.ref }}
        run: |
          plan="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --paginate --slurp | tee "$RUNNER_TEMP/pulls.json" | node scripts/release-plan.mjs)"
          printf '%s\n' "$plan"
          if [ -n "${{ inputs.retry_release_commit }}" ]; then
            test "$(printf '%s\n' "$plan" | grep '^release=')" = release=true
          fi
      - name: Check whether the merged release passed validation
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.target.outputs.sha }}
        if: steps.plan.outputs.release == 'true'
        run: node scripts/release-plan.mjs validated < "$RUNNER_TEMP/pulls.json"

  release-pr:
    needs: version
    if: needs.version.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ditherette-release-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Superseded PR-update jobs must always collect the latest pending changesets.
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require release PR credentials
        env:
          CHANGESETS_RELEASE_TOKEN: ${{ secrets.CHANGESETS_RELEASE_TOKEN }}
        run: |
          if [ -z "$CHANGESETS_RELEASE_TOKEN" ]; then
            echo '::error::Configure CHANGESETS_RELEASE_TOKEN with repository contents and pull-request write access so generated release PRs trigger CI.'
            exit 1
          fi
      - name: Open or update the release pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          github-token: ${{ secrets.CHANGESETS_RELEASE_TOKEN }}
          version-script: pnpm release:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false

  checks:
    name: Release validation
    needs: version
    if: >-
      needs.version.outputs.release == 'true' &&
      (needs.version.outputs.npm == 'true' || needs.version.outputs.web == 'true') &&
      needs.version.outputs.validated != 'true'
    uses: ./.github/workflows/release-validation.yml
    with:
      sha: ${{ needs.version.outputs.sha }}

  npm:
    name: Publish ditherette
    needs: [version, checks]
    if: >-
      needs.version.outputs.npm == 'true' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    uses: ./.github/workflows/package-publish.yml
    with:
      sha: ${{ needs.version.outputs.sha }}
    permissions:
      contents: write
      id-token: write

  website:
    name: Deploy the website
    needs: [version, checks, npm]
    if: >-
      !cancelled() && needs.version.outputs.web == 'true' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: ditherette-website
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 492214885e7a580ccc1d141dfdb4dc5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the deploy credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN with D1 and Pages write access so the release can deploy.'
            exit 1
          fi
      - name: Install the wasm toolchain
        run: |
          rustup show
          rustup toolchain install nightly-2024-08-02 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Reject superseded website releases
        env:
          GITHUB_SHA: ${{ needs.version.outputs.sha }}
        run: node scripts/release-plan.mjs current web
      - name: Build the website
        run: pnpm build
      - name: Apply production database migrations
        run: pnpm exec wrangler d1 migrations apply EVENTS --remote --env production
      - name: Deploy the website
        run: pnpm exec wrangler deploy --env production
      - name: Tag and release the deployed version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          tag="ditherette-web@$version"
          sha="${{ needs.version.outputs.sha }}"
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          if target="$(git rev-list -n 1 "refs/tags/$tag" 2>/dev/null)" && [ -n "$target" ]; then
            if [ "$target" = "$sha" ]; then
              echo "Release $tag already exists at $sha; skipping."
              exit 0
            fi
            echo "::error::Tag $tag exists at $target, not $sha." >&2
            exit 1
          fi
          node scripts/changelog-section.mjs CHANGELOG.md "$version" > "$RUNNER_TEMP/notes.md"
          git tag "$tag" "$sha"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --target "$sha" --title "ditherette-web $version" --notes-file "$RUNNER_TEMP/notes.md" --latest
