name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_release_commit:
        description: Retry npm publication for this 40-character release merge commit
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Ordinary pushes must not replace a queued release merge.
  group: ditherette-release-${{ inputs.retry_release_commit || github.sha }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      npm: ${{ steps.plan.outputs.npm }}
      pending: ${{ steps.plan.outputs.pending }}
      sha: ${{ steps.target.outputs.sha }}
      validated: ${{ steps.validate.outputs.validated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve the release commit
        id: target
        env:
          RETRY_SHA: ${{ inputs.retry_release_commit }}
        run: |
          if [ -z "$RETRY_SHA" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit
          fi
          if ! [[ "$RETRY_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'retry_release_commit must be a full commit SHA' >&2
            exit 1
          fi
          git cat-file -e "$RETRY_SHA^{commit}"
          git merge-base --is-ancestor "$RETRY_SHA" origin/main
          # Manifests, dependencies, and pending changesets must come from the retry target.
          git checkout --detach "$RETRY_SHA"
          echo "sha=$RETRY_SHA" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - name: Identify merged release and changed versions
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DITHERETTE_RELEASE_SHA: ${{ steps.target.outputs.sha }}
          # A retry replays the release merge; the plan still requires it to be one.
          DITHERETTE_RELEASE_RETRY: ${{ inputs.retry_release_commit != '' && 'true' || '' }}
        run: |
          plan="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DITHERETTE_RELEASE_SHA/pulls" --paginate --slurp | tee "$RUNNER_TEMP/pulls.json" | node scripts/release-plan.mjs)"
          printf '%s\n' "$plan"
          if [ -n "${{ inputs.retry_release_commit }}" ]; then
            test "$(printf '%s\n' "$plan" | grep '^release=')" = release=true
          fi
      - name: Check whether the merged release passed validation
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          DITHERETTE_RELEASE_SHA: ${{ steps.target.outputs.sha }}
        if: steps.plan.outputs.release == 'true'
        run: node scripts/release-plan.mjs validated < "$RUNNER_TEMP/pulls.json"

  release-pr:
    needs: version
    if: needs.version.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ditherette-release-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Superseded PR-update jobs must always collect the latest pending changesets.
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open or update the release pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          version-script: pnpm release:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false

  checks:
    name: Release validation
    needs: version
    if: >-
      needs.version.outputs.release == 'true' &&
      needs.version.outputs.npm == 'true' &&
      needs.version.outputs.validated != 'true'
    uses: ./.github/workflows/release-validation.yml
    with:
      sha: ${{ needs.version.outputs.sha }}

  npm:
    name: Publish ditherette
    needs: [version, checks]
    if: >-
      !cancelled() && needs.version.outputs.npm == 'true' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    uses: ./.github/workflows/package-publish.yml
    with:
      sha: ${{ needs.version.outputs.sha }}
    permissions:
      contents: write
      id-token: write
