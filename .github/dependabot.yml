version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /crates/ditherette-wasm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /crates/ditherette-wasm-old
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /crates/ditherette-bench
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /crates/ditherette-bench-oracle
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /crates/ditherette-bench-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /tools/spec-freeze/syntax
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
