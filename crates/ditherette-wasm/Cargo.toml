[package]
name = "ditherette-wasm"
version = "0.1.0"
edition = "2021"
description = "Fresh Rust/Wasm image-processing core for Ditherette."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
bench-subjects = ["dep:ditherette-bench-api"]
threads = ["dep:rayon", "dep:wasm-bindgen-rayon", "wasm-bindgen-rayon/no-bundler"]

[dependencies]
ditherette-bench-api = { path = "../ditherette-bench-api", optional = true }
js-sys = "0.3"
rayon = { version = "1.11", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.3", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
