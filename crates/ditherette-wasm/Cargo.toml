[package]
name = "ditherette-wasm"
version = "0.1.0"
edition = "2021"
description = "Fresh Rust/Wasm image-processing core for Ditherette."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
bench-subjects = ["dep:ditherette-bench-api"]

[dependencies]
ditherette-bench-api = { path = "../ditherette-bench-api", optional = true }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
