[package]
name = "ditherette-wasm"
version = "0.1.0-rc.0"
edition = "2021"
description = "Fresh Rust/Wasm image-processing core for Ditherette."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
bench-subjects = ["dep:ditherette-bench-api"]
threads = ["dep:rayon", "dep:wasm-bindgen-rayon", "wasm-bindgen-rayon/no-bundler"]
gpu = ["dep:wgpu", "dep:wasm-bindgen-futures"]

[dependencies]
ditherette-bench-api = { path = "../ditherette-bench-api", optional = true }
js-sys = "0.3"
rayon = { version = "1.11", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.3", optional = true }
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "wgsl", "webgpu", "vulkan", "metal", "dx12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
pollster = "0.4"
wasm-bindgen-test = "0.3"

[[example]]
name = "gpu_parity"
required-features = ["gpu"]

[profile.release]
opt-level = "s"
