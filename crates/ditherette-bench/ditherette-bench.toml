# Ditherette benchmark defaults.
#
# CLI flags always win over this file:
# built-in defaults < [defaults] < [profiles.NAME] < CLI flags.
#
# Keep [defaults] subject/oracle/baseline-free. Profiles may pin subjects for
# repeatable workflows, but should not pin oracles or baseline names by default.

[defaults]
preheat_time = "5s"
warm_up_time = "1s"
sample_size = 100
measurement_time = "10s"
target_sample_time = "50ms"

process_priority = "high"

scale_group = ["partial", "identity"]
sample_mode = "throughput"
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]

cache_state = "warm"
cache_scrub_size = "64MiB"
inter_sample_delay = "0ms"

correctness = "bounded"
max_color_distance = 2.0
max_mean_color_distance = 0.5
max_rms_color_distance = 0.5

baseline = "accepted"
live_stats = true

[profiles.all]
command = "perf"
domain = "resize"
subjects = [
  "prod:resize:nearest:scalar",
  "prod:resize:area:scalar",
  "prod:resize:bilinear:scalar",
  "prod:resize:bicubic:catmull-rom",
  "prod:resize:bicubic:catmull-rom-scale-aware",
  "prod:resize:lanczos2:fixed",
  "prod:resize:lanczos2:scale-aware",
  "prod:resize:lanczos3:fixed",
  "prod:resize:lanczos3:scale-aware"
]

[profiles.nearest]
command = "perf"
domain = "resize"
subjects = ["prod:resize:nearest:scalar"]
oracle = "spec:resize:nearest:scalar"
correctness = "exact"

[profiles.nearest-anisotropic]
command = "perf"
domain = "resize"
subjects = ["prod:resize:nearest:scalar"]
oracle = "spec:resize:nearest:scalar"
correctness = "exact"
scale_group = ["nearest-anisotropic"]

