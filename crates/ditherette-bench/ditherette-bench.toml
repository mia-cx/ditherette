# Ditherette benchmark defaults.
#
# CLI flags always win over this file:
# built-in defaults < [defaults] < [profiles.NAME] < CLI flags.
#
# Keep [defaults] subject/oracle/baseline-free. Profiles may pin subjects for
# repeatable workflows, but should not pin oracles or baseline names by default.

[defaults]
preheat_time = "5s"
warm_up_time = "1s"
sample_size = 100
measurement_time = "10s"
target_sample_time = "50ms"

process_priority = "high"

scale_group = ["partial", "identity"]
sample_mode = "throughput"
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]

cache_state = "warm"
cache_scrub_size = "64MiB"
inter_sample_delay = "0ms"

correctness = "bounded"
max_color_distance = 2.0
max_mean_color_distance = 0.5
max_rms_color_distance = 0.5

baseline = "accepted"
live_stats = true

[profiles.nearest]
command = "perf"
domain = "resize"
subjects = ["prod:resize:nearest:scalar"]
oracle = "spec:resize:nearest:scalar"
correctness = "exact"

[profiles.area]
command = "perf"
domain = "resize"
subjects = ["prod:resize:area:scalar"]
oracle = "spec:resize:area:scalar"

[profiles.bilinear]
command = "perf"
domain = "resize"
subjects = ["prod:resize:bilinear:scalar"]
oracle = "spec:resize:bilinear:scalar"
correctness = "bounded"
scale_group = ["partial", "identity", "bilinear-anisotropic"]

# ACCEPT(perf): Production convolution filters may use bounded color-distance
# correctness, which unlocks f32 accumulation, normalized weights, compact taps,
# and approximate path experiments against the six convolution profiles below.
# TODO(perf:harness, rank=2): Add a diagnostic anisotropic/identity-axis scale
# group for convolution filters before accepting width-only, height-only, or
# separable path splits. Benchmark with the six convolution profiles below using
# manifest-defined fixtures and oracles.
[profiles.bicubic]
command = "perf"
domain = "resize"
subjects = ["prod:resize:bicubic:catmull-rom"]
oracle = "spec:resize:bicubic:catmull-rom"
correctness = "bounded"

[profiles.bicubic-scale-aware]
command = "perf"
domain = "resize"
subjects = ["prod:resize:bicubic:catmull-rom-scale-aware"]
oracle = "spec:resize:bicubic:catmull-rom-scale-aware"
correctness = "bounded"

[profiles.lanczos2]
command = "perf"
domain = "resize"
subjects = ["prod:resize:lanczos2:fixed"]
oracle = "spec:resize:lanczos2:fixed"
correctness = "bounded"

[profiles.lanczos2-scale-aware]
command = "perf"
domain = "resize"
subjects = ["prod:resize:lanczos2:scale-aware"]
oracle = "spec:resize:lanczos2:scale-aware"
correctness = "bounded"

[profiles.lanczos3]
command = "perf"
domain = "resize"
subjects = ["prod:resize:lanczos3:fixed"]
oracle = "spec:resize:lanczos3:fixed"
correctness = "bounded"

[profiles.lanczos3-scale-aware]
command = "perf"
domain = "resize"
subjects = ["prod:resize:lanczos3:scale-aware"]
oracle = "spec:resize:lanczos3:scale-aware"
correctness = "bounded"

[profiles.trilinear]
command = "perf"
domain = "resize"
subjects = ["spec:resize:trilinear:mip-area"]
