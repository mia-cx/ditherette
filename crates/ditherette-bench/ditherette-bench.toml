# Ditherette benchmark defaults.
#
# CLI flags always win over this file:
# built-in defaults < [defaults] < [profiles.NAME] < CLI flags.
#
# Keep [defaults] subject/oracle/baseline-free. Profiles may pin subjects for
# repeatable workflows, but should not pin oracles or baseline names by default.

[defaults]
preheat_time = "5s"
warm_up_time = "1s"
sample_size = 100
measurement_time = "10s"
target_sample_time = "50ms"

process_priority = "high"

scale_group = ["partial", "identity"]
sample_mode = "throughput"
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]

cache_state = "warm"
cache_scrub_size = "64MiB"
inter_sample_delay = "0ms"

correctness = "bounded"
max_color_distance = 2.0
max_mean_color_distance = 0.5
max_rms_color_distance = 0.5

baseline = "accepted"
live_stats = true

[profiles.all]
command = "perf"
domain = "resize"
subjects = [
  "prod:resize:nearest:scalar",
  "prod:resize:area:scalar",
  "prod:resize:bilinear:scalar",
  "prod:resize:bicubic:catmull-rom",
  "prod:resize:bicubic:catmull-rom-scale-aware",
  "prod:resize:lanczos2:fixed",
  "prod:resize:lanczos2:scale-aware",
  "prod:resize:lanczos3:fixed",
  "prod:resize:lanczos3:scale-aware"
]

[profiles.nearest]
command = "perf"
domain = "resize"
subjects = ["prod:resize:nearest:scalar"]
oracle = "spec:resize:nearest:scalar"
correctness = "exact"

# TODO(perf:harness, rank=15): Add a scalar nearest anisotropic profile before
# testing width-only or height-only nearest path splits; use exact correctness
# and manifest fixtures so same-width/same-height row-copy ideas are represented
# separately from `ditherette-bench run nearest`.

[profiles.area]
command = "perf"
domain = "resize"
subjects = ["prod:resize:area:scalar"]
oracle = "spec:resize:area:scalar"

# TODO(perf:harness, rank=16): Add scalar `area-cached-plan` and
# `area-anisotropic` profiles now `AreaResizePlan` stores overlap spans and the
# separable area path has one-axis gate TODOs. Benchmark with bounded area
# correctness before tuning cached-plan ownership or width-only/height-only area.

[profiles.bilinear]
command = "perf"
domain = "resize"
subjects = ["prod:resize:bilinear:scalar"]
oracle = "spec:resize:bilinear:scalar"
correctness = "bounded"
scale_group = ["partial", "identity", "bilinear-anisotropic"]

# TODO(perf:harness, rank=17): Add a scalar `bilinear-cached-plan` profile only
# for repeated same-dimension resizes; the existing `bilinear` profile measures
# one-shot public API cost, so cached-plan work needs a separate subject before
# changing plan ownership or scratch reuse.

# ACCEPT(perf): Production convolution filters may use bounded color-distance
# correctness, which unlocks f32 accumulation, normalized weights, compact taps,
# and approximate path experiments against the six convolution profiles below.
# ACCEPT(perf): `convolution-anisotropic` covers identity-axis width-only and
# height-only diagnostic cases for convolution path-split experiments.
[profiles.bicubic]
command = "perf"
domain = "resize"
subjects = ["prod:resize:bicubic:catmull-rom"]
oracle = "spec:resize:bicubic:catmull-rom"
correctness = "bounded"

