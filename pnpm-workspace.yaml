packages:
  - '.'
  - crates/ditherette-wasm
  - packages/ditherette
engineStrict: true
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true
  wasm-pack: true
overrides:
  cookie@<0.7.0: '>=0.7.0'
  # GHSA-rj75-hqrm-r3gf; parser API/AST and prose CSS match the pinned version in test:typography.
  # Remove after upgrading Typography to a release of https://github.com/tailwindlabs/tailwindcss-typography/pull/429.
  '@tailwindcss/typography>postcss-selector-parser@6.0.10': '7.1.6'
minimumReleaseAgeExclude:
  # These exact upstream releases carry the patched sharp and undici dependencies.
  # Remove once they satisfy the configured release age.
  - miniflare@5.20261012.0-beta
  - wrangler@4.151.0
