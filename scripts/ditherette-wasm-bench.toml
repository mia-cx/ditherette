# Ditherette browser/Wasm benchmark defaults.
#
# Mirrors crates/ditherette-bench/ditherette-bench.toml where browser/Wasm can
# support the same resize subject/filter matrix. CLI flags always win:
# built-in defaults < [defaults] < [profiles.NAME] < CLI flags.

[defaults]
command = "perf"
domain = "resize"
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]
scale_group = ["partial", "identity"]
lanes = ["decoded-rgba"]
sample_size = 100
measurement_time = "10s"
warm_up_time = "1s"
target_sample_time = "50ms"
baseline = "accepted"
live_stats = true

[profiles.all]
command = "perf"
domain = "resize"
subjects = [
  "wasm:resize:nearest:scalar",
  "wasm:resize:area:scalar",
  "wasm:resize:bilinear:scalar",
  "wasm:resize:bicubic:catmull-rom",
  "wasm:resize:bicubic:catmull-rom-scale-aware",
  "wasm:resize:lanczos2:fixed",
  "wasm:resize:lanczos2:scale-aware",
  "wasm:resize:lanczos3:fixed",
  "wasm:resize:lanczos3:scale-aware"
]

[profiles.nearest]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:nearest:scalar"]

[profiles.area]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:area:scalar"]

[profiles.bilinear]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:bilinear:scalar"]
scale_group = ["partial", "identity", "bilinear-anisotropic"]

[profiles.bicubic]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:bicubic:catmull-rom"]

[profiles.bicubic-scale-aware]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:bicubic:catmull-rom-scale-aware"]

[profiles.lanczos2]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos2:fixed"]

[profiles.lanczos2-scale-aware]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos2:scale-aware"]

[profiles.lanczos3]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos3:fixed"]

[profiles.lanczos3-scale-aware]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos3:scale-aware"]

[profiles.resize-diagnostics]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:nearest:pooled_noop", "wasm:resize:nearest:pooled_copy"]
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]
scale_group = ["partial", "identity"]
lanes = ["decoded-rgba"]

[profiles.convolution-plan-scope]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos3:fixed", "wasm:resize:lanczos3:pooled_direct", "wasm:resize:lanczos3:pooled_direct_per_band_plan"]
periodic_scalar_remeasurement = true
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]
scale_group = ["partial", "identity"]
lanes = ["decoded-rgba"]

[profiles.convolution-thread]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos3:fixed", "wasm:resize:lanczos3:pooled_direct"]
periodic_scalar_remeasurement = true
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]
scale_group = ["partial", "identity"]
lanes = ["decoded-rgba"]

[profiles.nearest-thread]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:nearest:scalar", "wasm:resize:nearest:pooled_direct"]
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]
scale_group = ["partial", "identity"]
lanes = ["decoded-rgba"]

[profiles.color]
command = "perf"
domain = "color"
subjects = [
  "wasm:color:linear-srgb-f32:scalar",
  "wasm:color:linear-srgb-f32:pooled_direct",
  "wasm:color:linear-srgb-f32:pooled_noop",
  "wasm:color:linear-srgb-f32:pooled_copy",
  "wasm:color:oklab-f32:scalar",
  "wasm:color:oklab-f32:pooled_direct",
  "wasm:color:cielab-f32:scalar",
  "wasm:color:cielab-f32:pooled_direct"
]
scales = [1]
lanes = ["decoded-rgba"]
