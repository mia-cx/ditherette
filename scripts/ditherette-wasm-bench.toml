# Ditherette browser/Wasm benchmark defaults.
#
# Start from crates/ditherette-bench/ditherette-bench.toml and keep the same
# defaults/profile semantics. Browser/Wasm-specific profiles are appended below;
# unsupported native-only fields are intentionally preserved and ignored by the
# browser transport instead of silently changing profile behavior.
#
# CLI flags always win over this file:
# built-in defaults < [defaults] < [profiles.NAME] < CLI flags.
#
# Keep [defaults] subject/oracle/baseline-free. Profiles may pin subjects for
# repeatable workflows, but should not pin oracles or baseline names by default.

[defaults]
preheat_time = "5s"
warm_up_time = "1s"
sample_size = 100
measurement_time = "10s"
target_sample_time = "50ms"

process_priority = "high"

scale_group = ["partial", "identity"]
sample_mode = "throughput"
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]

cache_state = "warm"
cache_scrub_size = "64MiB"
inter_sample_delay = "0ms"

correctness = "bounded"
max_color_distance = 2.0
max_mean_color_distance = 0.5
max_rms_color_distance = 0.5

baseline = "accepted"
live_stats = true

[profiles.all]
command = "perf"
domain = "resize"
subjects = [
  "wasm:resize:nearest:scalar",
  "wasm:resize:area:scalar",
  "wasm:resize:bilinear:scalar",
  "wasm:resize:bicubic:catmull-rom",
  "wasm:resize:bicubic:catmull-rom-scale-aware",
  "wasm:resize:lanczos2:fixed",
  "wasm:resize:lanczos2:scale-aware",
  "wasm:resize:lanczos3:fixed",
  "wasm:resize:lanczos3:scale-aware"
]

[profiles.nearest]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:nearest:scalar"]
oracle = "spec:resize:nearest:scalar"
correctness = "exact"

[profiles.area]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:area:scalar"]
oracle = "spec:resize:area:scalar"

[profiles.bilinear]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:bilinear:scalar"]
oracle = "spec:resize:bilinear:scalar"
correctness = "bounded"
scale_group = ["partial", "identity", "bilinear-anisotropic"]

[profiles.bicubic]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:bicubic:catmull-rom"]
oracle = "spec:resize:bicubic:catmull-rom"
correctness = "bounded"

[profiles.bicubic-scale-aware]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:bicubic:catmull-rom-scale-aware"]
oracle = "spec:resize:bicubic:catmull-rom-scale-aware"
correctness = "bounded"

[profiles.lanczos2]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos2:fixed"]
oracle = "spec:resize:lanczos2:fixed"
correctness = "bounded"

[profiles.lanczos2-scale-aware]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos2:scale-aware"]
oracle = "spec:resize:lanczos2:scale-aware"
correctness = "bounded"

[profiles.lanczos3]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos3:fixed"]
oracle = "spec:resize:lanczos3:fixed"
correctness = "bounded"

[profiles.lanczos3-scale-aware]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos3:scale-aware"]
oracle = "spec:resize:lanczos3:scale-aware"
correctness = "bounded"


[profiles.trilinear]
command = "perf"
domain = "resize"
subjects = ["spec:resize:trilinear:mip-area"]

[profiles.tiling-sweep]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = [
  "nearest",
  "area",
  "bilinear",
  "bicubic",
  "bicubic-scale-aware",
  "lanczos2",
  "lanczos2-scale-aware",
  "lanczos3",
  "lanczos3-scale-aware"
]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]

target_sample_time = "1ms"
sample_size = 50
[profiles.tiling-sweep-nearest]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = ["nearest"]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]

target_sample_time = "1ms"
sample_size = 50
[profiles.tiling-sweep-area]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = ["area"]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]

target_sample_time = "1ms"
sample_size = 50
[profiles.tiling-sweep-bilinear]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = ["bilinear"]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]

target_sample_time = "1ms"
sample_size = 50
[profiles.tiling-sweep-bicubic]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = ["bicubic"]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]

target_sample_time = "1ms"
sample_size = 50
[profiles.tiling-sweep-bicubic-scale-aware]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = ["bicubic-scale-aware"]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]

target_sample_time = "1ms"
sample_size = 50
[profiles.tiling-sweep-lanczos2]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = ["lanczos2"]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]

target_sample_time = "1ms"
sample_size = 50
[profiles.tiling-sweep-lanczos2-scale-aware]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = ["lanczos2-scale-aware"]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]

target_sample_time = "1ms"
sample_size = 50
[profiles.tiling-sweep-lanczos3]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = ["lanczos3"]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]

target_sample_time = "1ms"
sample_size = 50
[profiles.tiling-sweep-lanczos3-scale-aware]
command = "tiling-sweep"
fixtures = ["Celeste_Insta_selfie", "Celeste_box_art"]
filters = ["lanczos3-scale-aware"]
worker_counts = [1, 2, 3, 4, 5, 6, 7, 8]
target_sample_time = "1ms"
sample_size = 50

# Browser/Wasm-only diagnostic and threaded prototype profiles.

[profiles.resize-diagnostics]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:nearest:pooled_noop", "wasm:resize:nearest:pooled_copy"]
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]
scale_group = ["partial", "identity"]
lanes = ["decoded-rgba"]

[profiles.convolution-plan-scope]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos3:fixed", "wasm:resize:lanczos3:pooled_direct", "wasm:resize:lanczos3:pooled_direct_per_band_plan"]
periodic_scalar_remeasurement = true
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]
scale_group = ["partial", "identity"]
thread_counts = [2, 4, 6, 8]
row_band_heights = [32, 64, 128, 256, "even"]
lanes = ["decoded-rgba"]

[profiles.convolution-thread]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:lanczos3:fixed", "wasm:resize:lanczos3:pooled_direct"]
periodic_scalar_remeasurement = true
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]
scale_group = ["partial", "identity"]
thread_counts = [2, 4, 6, 8]
row_band_heights = [32, 64, 128, 256, "even"]
lanes = ["decoded-rgba"]

[profiles.nearest-thread]
command = "perf"
domain = "resize"
subjects = ["wasm:resize:nearest:scalar", "wasm:resize:nearest:pooled_direct"]
fixtures = ["Celeste_Insta_selfie.png", "Celeste_box_art.png"]
scale_group = ["partial", "identity"]
thread_counts = [2, 4, 6, 8]
row_band_heights = [32, 64, 128, 256, "even"]
lanes = ["decoded-rgba"]

[profiles.color]
command = "perf"
domain = "color"
subjects = [
  "wasm:color:linear-srgb-f32:scalar",
  "wasm:color:linear-srgb-f32:pooled_direct",
  "wasm:color:oklab-f32:scalar",
  "wasm:color:oklab-f32:pooled_direct",
  "wasm:color:cielab-f32:scalar",
  "wasm:color:cielab-f32:pooled_direct"
]
scales = [1]
thread_counts = [2, 4, 6, 8]
row_band_heights = [32, 64, 128, 256, "even"]
lanes = ["decoded-rgba"]
